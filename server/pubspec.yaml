name: shards_server
description: Authoritative WebSocket game server for the Shards of Infinity clone.
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # The shared game engine. The server only imports the Flutter-FREE parts
  # (GameService, models, CardDatabase, codecs) — see
  # ai-docs/multiplayer_architecture.md.
  simple_card_game:
    path: ../
  sqlite3: ^3.3.3

dev_dependencies:
  test: ^1.24.0
