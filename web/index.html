<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fragments of Boundlessness — digital card game.">

  <!-- Viewport: viewport-fit=cover lets the app paint under the notch / home
       indicator, and disabling user-scaling keeps it feeling like a native app
       (the board manages its own scrolling). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Fullscreen / app-like PWA tags. With these, "Add to Home Screen" on
       iOS and Android launches the app standalone — no browser address bar. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fragments of Boundlessness">
  <!-- Address-bar / status-bar tint to match the dark board chrome. -->
  <meta name="theme-color" content="#0A1B2A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fragments of Boundlessness</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Deterministic auto-refresh on new deploys.

       The Flutter service worker doesn't reliably activate on a plain refresh
       (an updated SW sits in `waiting` until every tab closes), so a returning
       user can keep running a stale cached build. Instead of relying on SW
       activation, we POLL a tiny version stamp:

         * The deploy step overwrites `version.json` with the new build's git SHA.
         * On load we fetch it (cache-busted) and remember it as THIS session's
           running build.
         * We re-fetch on an interval, on tab focus, and on regaining network.
           If the served build differs from the one we started with, a new
           version has been deployed → we unregister the service worker, clear
           all caches, and hard-reload ONCE.

       This catches everyone within ~30s of a redeploy — fresh visitors AND
       people mid-session — without any manual cache clearing. The one-shot
       guard prevents a reload loop. -->
  <script>
    (function () {
      var runningBuild = null;      // the build this tab is actually running
      var reloading = false;        // one-shot guard

      function versionUrl() {
        return 'version.json?ts=' + Date.now(); // bust every HTTP/SW cache
      }

      function hardReload() {
        if (reloading) return;
        reloading = true;
        var done = function () { window.location.reload(); };
        // Best-effort: drop the SW + caches so the reload fetches fresh assets.
        var tasks = [];
        try {
          if ('serviceWorker' in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches && caches.keys) {
            tasks.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}));
          }
        } catch (e) { /* ignore */ }
        Promise.all(tasks).then(done, done);
        // Fallback in case the promises never settle.
        setTimeout(done, 1500);
      }

      function checkVersion() {
        if (reloading) return;
        fetch(versionUrl(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (!j || !j.build) return;
            if (runningBuild === null) {
              runningBuild = j.build;          // first load — record it
            } else if (j.build !== runningBuild) {
              hardReload();                    // a new build was deployed
            }
          })
          .catch(function () { /* offline / transient — ignore */ });
      }

      checkVersion();
      setInterval(checkVersion, 30000);        // poll every 30s
      window.addEventListener('focus', checkVersion);
      window.addEventListener('online', checkVersion);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
